       <script>

    $(document).ready(function(){
        let slides = $(".slide-show-container img");
        let currentIndex = 0;

        function slideImages() {
            let currentSlide = slides.eq(currentIndex);
            currentIndex = (currentIndex + 1) % slides.length;
            let nextSlide = slides.eq(currentIndex);

            // slide animation
            currentSlide.animate({left: '100%'}, 1000, function() {
                $(this).css('left', '-100%'); 
            });
            nextSlide.animate({left: '0%'}, 1000);
        }

        setInterval(slideImages, 4000); 
    });
    </script>
